<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">Calculator</h1>
        </header>
        <main>
            <section class="result-container">
                <input type="text" id="calc-preview" class="calc-preview" readonly>
                <p class="result"></p>
            </section>
            <section class="keypad-container">
                <section class="numbers-container">
                    <button type="button" class="keypad number satu">1</button>
                    <button type="button" class="keypad number dua">2</button>
                    <button type="button" class="keypad number tiga">3</button>
                    <button type="button" class="keypad number empat">4</button>
                    <button type="button" class="keypad number lima">5</button>
                    <button type="button" class="keypad number enam">6</button>
                    <button type="button" class="keypad number tujuh">7</button>
                    <button type="button" class="keypad number delapan">8</button>
                    <button type="button" class="keypad number sembilan">9</button>
                    <button type="button" class="keypad number koma">.</button>
                    <button type="button" class="keypad number nol">0</button>
                    <button type="button" class="keypad number double-nol">00</button>
                </section>
                <section class="operations-container">
                    <button type="button" class="keypad del">C</button>
                    <button type="button" class="keypad del-all">CA</button>
                    <button type="button" class="keypad operation tambah"> + </button>
                    <button type="button" class="keypad operation kurang"> - </button>
                    <button type="button" class="keypad operation kali"> x </button>
                    <button type="button" class="keypad operation bagi"> / </button>
                    <button type="button" class="keypad sama-dengan">=</button>
                </section>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
