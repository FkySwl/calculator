<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">Calculator</h1>
        </header>
        <main>
            <section class="result-container">
                <input type="text" id="calculate" class="calculate" readonly>
                <p class="result"></p>
            </section>
            <section class="keypad-container">
                <section class="numbers-container">
                    <button type="button" class="number satu">1</button>
                    <button type="button" class="number dua">2</button>
                    <button type="button" class="number tiga">3</button>
                    <button type="button" class="number empat">4</button>
                    <button type="button" class="number lima">5</button>
                    <button type="button" class="number enam">6</button>
                    <button type="button" class="number tujuh">7</button>
                    <button type="button" class="number delapan">8</button>
                    <button type="button" class="number sembilan">9</button>
                    <button type="button" class="number koma">.</button>
                    <button type="button" class="number nol">0</button>
                    <button type="button" class="sama-dengan"> = </button>
                </section>
                <section class="operations-container">
                    <button type="button" class="operation tambah"> + </button>
                    <button type="button" class="operation kurang"> - </button>
                    <button type="button" class="operation kali"> x </button>
                    <button type="button" class="operation bagi"> / </button>
                </section>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
